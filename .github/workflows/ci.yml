name: CI

on:
  pull_request: ~
  push:
    branches:
      - '*'
    tags:
      - '*'

jobs:
  cs:
    name: Coding Style
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ecs
        run: cd tools/ecs && composer update --no-interaction

      - name: Run the CS fixer
        run: composer cs-fixer

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the dependencies
        run: |
          composer update --no-interaction --no-progress
          cd tools/phpstan && composer update --no-interaction
      - name: Run PHPStan
        run: composer phpstan

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3,8.4,8.5 ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install the dependencies
        run: composer update --no-interaction

      - name: Run the unit tests
        run: composer unit-tests

      - name: Run the functional tests
        run: composer functional-tests
